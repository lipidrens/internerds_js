<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vancomycine Dosering Calculator voor Hemodialyse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="wrapper">
        <div class="container">
            <h1>Vancomycine Dosering</h1>

            <form id="calculatorForm">
                <div class="form-group">
                    <label for="weight">Gewicht (kg)</label>
                    <input type="number" id="weight" min="0" step="0.1" placeholder="Bijv. 70">
                </div>

                <div class="form-group">
                    <label for="residualFunction">Restfunctie</label>
                    <select id="residualFunction">
                        <option value="">-- Selecteer --</option>
                        <option value="zonder">Zonder restfunctie</option>
                        <option value="met">Met restfunctie</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="bridgingPeriod">Aantal dagen tot volgende dialyse/toediening</label>
                    <select id="bridgingPeriod">
                        <option value="">-- Selecteer --</option>
                        <option value="2">2 dagen</option>
                        <option value="3">3 dagen</option>
                    </select>
                </div>
            </form>

            <div class="results show" id="results">
                <p class="result-legend">Eerste getal afgerond op 50 mg, tweede getal op 250 mg.</p>
                <div class="result-item">
                    <div class="result-value">
                        <span id="vancoResult">Oplaaddosis = -
Onderhoudsdosis = -</span>
                    </div>
                </div>
            </div>
            <p class="info-note">Toedienen in laatste half uur van dialyse; dalspiegel prikken vóór
                elke volgende dialyse en titreren op concentratie.</p>
            <div class="button-container">
                <button type="button" id="resetButton" class="reset-button">Reset</button>
                <button type="button" id="copyButton" class="copy-button"
                    title="Kopieer naar klembord">Kopieer</button>
            </div>
        </div>
    </div>

    <script src="shared.js"></script>
    <script>
        // Functie om af te ronden op dichtstbijzijnde veelvoud van 250
        function roundToNearest250(value) {
            return Math.round(value / 250) * 250;
        }

        // Functie om af te ronden op dichtstbijzijnde veelvoud van 50
        function roundToNearest50(value) {
            return Math.round(value / 50) * 50;
        }

        let currentResultText = '';

        function calculateVanco() {
            const weight = parseFloat(document.getElementById('weight').value);
            const residualFunction = document.getElementById('residualFunction').value;
            const bridgingPeriod = document.getElementById('bridgingPeriod').value;

            if (!weight || weight <= 0 || !residualFunction || !bridgingPeriod) {
                currentResultText = 'Oplaaddosis = -\nOnderhoudsdosis = -';
                document.getElementById('vancoResult').textContent = currentResultText;
                return;
            }

            let loadingMax, maintenancePerKg, maintenanceMax;

            if (residualFunction === 'zonder') {
                loadingMax = 1500;
                maintenancePerKg = 7.5;
                maintenanceMax = 750;
            } else {
                loadingMax = 2000;
                maintenancePerKg = 10;
                maintenanceMax = 1000;
            }

            let loadingDose = Math.min(20 * weight, loadingMax);

            if (bridgingPeriod === '3') {
                maintenancePerKg *= 1.25;
                // Max ook +25%, maar nooit boven de max oplaaddosis
                maintenanceMax = Math.min(maintenanceMax * 1.25, loadingMax);
            }

            let maintenanceDose = Math.min(maintenancePerKg * weight, maintenanceMax);

            const loading50 = roundToNearest50(loadingDose);
            const loading250 = roundToNearest250(loadingDose);
            const maintenance50 = roundToNearest50(maintenanceDose);
            const maintenance250 = roundToNearest250(maintenanceDose);

            currentResultText =
                `Oplaaddosis = ${loading50} / ${loading250} mg\n` +
                `Onderhoudsdosis = ${maintenance50} / ${maintenance250} mg`;
            document.getElementById('vancoResult').textContent = currentResultText;
        }

        // Real-time berekening bij input wijziging
        document.getElementById('weight').addEventListener('input', calculateVanco);
        document.getElementById('residualFunction').addEventListener('change', calculateVanco);
        document.getElementById('bridgingPeriod').addEventListener('change', calculateVanco);

        setupCopy('copyButton', () => currentResultText);

        // Reset
        document.getElementById('resetButton').addEventListener('click', function () {
            document.getElementById('weight').value = '';
            document.getElementById('residualFunction').selectedIndex = 0;
            document.getElementById('bridgingPeriod').selectedIndex = 0;
            calculateVanco();
            showButtonFeedback(this, 'reset-done');
        });

        // Initiële berekening
        calculateVanco();
    </script>
</body>

</html>
