<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vancomycine Dosering Calculator voor Hemodialyse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="wrapper">
        <div class="container">
            <h1>Vancomycine Dosering</h1>

            <form id="calculatorForm">
                <div class="form-group">
                    <label for="weight">Gewicht (kg)</label>
                    <input type="number" id="weight" min="0" step="0.1" placeholder="Bijv. 70">
                </div>

                <div class="form-group">
                    <label for="timing">Tijdstip van toediening</label>
                    <select id="timing">
                        <option value="">-- Selecteer --</option>
                        <option value="na">Na dialyse</option>
                        <option value="tijdens">Tijdens dialyse (laatste 30-60 minuten)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="bridgingPeriod">Aantal dagen tot volgende dialyse/toediening</label>
                    <select id="bridgingPeriod">
                        <option value="">-- Selecteer --</option>
                        <option value="2">2 dagen</option>
                        <option value="3">3 dagen</option>
                    </select>
                </div>
            </form>

            <div class="results show" id="results">
                <div class="result-item">
                    <div class="result-value">
                        <span id="vancoResult">Oplaaddosis = -
Onderhoudsdosis = -</span>
                    </div>
                </div>
            </div>
            <div class="button-container">
                <button type="button" id="resetButton" class="reset-button">Reset</button>
                <button type="button" id="copyButton" class="copy-button"
                    title="Kopieer naar klembord">Kopieer</button>
            </div>
        </div>
    </div>

    <script src="shared.js"></script>
    <script>
        // Functie om af te ronden op dichtstbijzijnde veelvoud van 250
        function roundToNearest250(value) {
            return Math.round(value / 250) * 250;
        }

        let currentResultText = '';

        function calculateVanco() {
            const weight = parseFloat(document.getElementById('weight').value);
            const timing = document.getElementById('timing').value;
            const bridgingPeriod = document.getElementById('bridgingPeriod').value;

            if (!weight || weight <= 0 || !timing || !bridgingPeriod) {
                currentResultText = 'Oplaaddosis = -\nOnderhoudsdosis = -';
                document.getElementById('vancoResult').textContent = currentResultText;
                return;
            }

            let loadingDose, maintenancePerKg, maintenanceMax;

            if (timing === 'na') {
                loadingDose = Math.min(25 * weight, 2000);
                maintenancePerKg = 7.5;
                maintenanceMax = 750;
            } else {
                loadingDose = Math.min(35 * weight, 2500);
                maintenancePerKg = 10;
                maintenanceMax = 1000;
            }

            if (bridgingPeriod === '3') {
                maintenancePerKg *= 1.25;
                maintenanceMax *= 1.25;
            }

            let maintenanceDose = Math.min(maintenancePerKg * weight, maintenanceMax);

            loadingDose = roundToNearest250(loadingDose);
            maintenanceDose = roundToNearest250(maintenanceDose);

            currentResultText = `Oplaaddosis = ${loadingDose} mg\nOnderhoudsdosis = ${maintenanceDose} mg`;
            document.getElementById('vancoResult').textContent = currentResultText;
        }

        // Real-time berekening bij input wijziging
        document.getElementById('weight').addEventListener('input', calculateVanco);
        document.getElementById('timing').addEventListener('change', calculateVanco);
        document.getElementById('bridgingPeriod').addEventListener('change', calculateVanco);

        setupCopy('copyButton', () => currentResultText);

        // Reset
        document.getElementById('resetButton').addEventListener('click', function () {
            document.getElementById('weight').value = '';
            document.getElementById('timing').selectedIndex = 0;
            document.getElementById('bridgingPeriod').selectedIndex = 0;
            calculateVanco();
            showButtonFeedback(this, 'reset-done');
        });

        // Initiële berekening
        calculateVanco();
    </script>
</body>

</html>
