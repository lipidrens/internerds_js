<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>qSOFA Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="wrapper">
        <!-- qSOFA Calculator -->
        <div class="container">
            <h1>qSOFA Criteria</h1>
            <p class="subtitle">Quick Sequential Organ Failure Assessment</p>

            <form id="qsofaForm">
                <div class="form-group">
                    <label>Ademfrequentie >22/min</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="af_qsofa" value="0" checked>
                            Nee
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="af_qsofa" value="1">
                            Ja
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Veranderd bewustzijn</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="mental_qsofa" value="0" checked>
                            Nee
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="mental_qsofa" value="1">
                            Ja
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Systolische bloeddruk ≤100 mmHg</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="sbp_qsofa" value="0" checked>
                            Nee
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="sbp_qsofa" value="1">
                            Ja
                        </label>
                    </div>
                </div>
            </form>

            <div class="results show" id="qsofaResults">
                <div class="result-item">
                    <div class="result-value">
                        <span id="qsofaScore">qSOFA score = 0</span>
                    </div>
                </div>
            </div>
            <div class="button-container">
                <button type="button" id="resetButtonQsofa" class="reset-button">Reset</button>
                <button type="button" id="copyButtonQsofa" class="copy-button"
                    title="Kopieer naar klembord">Kopieer</button>
            </div>
        </div>

        <!-- SIRS Calculator -->
        <div class="container">
            <h1>SIRS Criteria</h1>
            <p class="subtitle">Systemic Inflammatory Response Syndrome</p>

            <form id="sirsForm">
                <div class="form-group">
                    <label>Temperatuur <36 of>38°C</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="temp_sirs" value="0" checked>
                            Nee
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="temp_sirs" value="1">
                            Ja
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Polsfrequentie >90/min</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="hr_sirs" value="0" checked>
                            Nee
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="hr_sirs" value="1">
                            Ja
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Ademfrequentie >20/min</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="af_sirs" value="0" checked>
                            Nee
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="af_sirs" value="1">
                            Ja
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Leukocyten <4 x10⁹/L of>12 x10⁹/L; of >10% staafkernige neutrofiele granulocyten</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="leuko_sirs" value="0" checked>
                            Nee
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="leuko_sirs" value="1">
                            Ja
                        </label>
                    </div>
                </div>
            </form>

            <div class="results show" id="sirsResults">
                <div class="result-item">
                    <div class="result-value">
                        <span id="sirsScore">SIRS score = 0 = geen SIRS</span>
                    </div>
                </div>
            </div>
            <div class="button-container">
                <button type="button" id="resetButtonSirs" class="reset-button">Reset</button>
                <button type="button" id="copyButtonSirs" class="copy-button"
                    title="Kopieer naar klembord">Kopieer</button>
            </div>
        </div>

        <!-- Glasgow Coma Scale Calculator -->
        <div class="container">
            <h1>Glasgow Coma Scale</h1>
            <p class="subtitle">EMV-score</p>

            <form id="emvForm">
                <div class="form-group">
                    <label for="E_emv">Eye opening</label>
                    <select id="E_emv" required>
                        <option value="4">Opent ogen spontaan</option>
                        <option value="3">Opent ogen op aanspreken</option>
                        <option value="2">Opent ogen op pijnprikkel</option>
                        <option value="1">Opent ogen niet</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="M_emv">Motor response</label>
                    <select id="M_emv" required>
                        <option value="6">Voert eenvoudige opdracht uit</option>
                        <option value="5">Lokaliseert een pijnprikkel</option>
                        <option value="4">Normale flexie op pijnprikkel</option>
                        <option value="3">Abnormale flexie op pijnprikkel</option>
                        <option value="2">Extensie op pijnprikkel</option>
                        <option value="1">Geen reactie op pijnprikkel</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="V_emv">Verbal response</label>
                    <select id="V_emv" required>
                        <option value="5">Georiënteerd in trias</option>
                        <option value="4">Conversatie mogelijk, doch verward</option>
                        <option value="3">Spreekt, maar geen conversatie mogelijk</option>
                        <option value="2">Kreunt alleen</option>
                        <option value="1">Geen verbale uitingen</option>
                    </select>
                </div>
            </form>

            <div class="results show" id="emvResults">
                <div class="result-item">
                    <div class="result-value">
                        <span id="emvScore">EMV = E4 M6 V5 (totaal = 15)</span>
                    </div>
                </div>
            </div>
            <div class="button-container">
                <button type="button" id="resetButtonEmv" class="reset-button">Reset</button>
                <button type="button" id="copyButtonEmv" class="copy-button"
                    title="Kopieer naar klembord">Kopieer</button>
            </div>
        </div>

        <!-- Mean Arterial Pressure Calculator -->
        <div class="container">
            <h1>Mean Arterial Pressure</h1>
            <p class="subtitle">MAP Calculator</p>

            <form id="mapForm">
                <div class="form-group">
                    <label for="SBPmap">Systolische Bloeddruk (mmHg)</label>
                    <input type="number" id="SBPmap" min="0" max="250" step="1" placeholder="Bijv. 120">
                </div>

                <div class="form-group">
                    <label for="DBPmap">Diastolische Bloeddruk (mmHg)</label>
                    <input type="number" id="DBPmap" min="0" max="130" step="1" placeholder="Bijv. 80">
                </div>
            </form>

            <div class="results show" id="mapResults">
                <div class="result-item">
                    <div class="result-value">
                        <span id="mapScore">MAP = - mmHg</span>
                    </div>
                </div>
            </div>
            <div class="button-container">
                <button type="button" id="resetButtonMap" class="reset-button">Reset</button>
                <button type="button" id="copyButtonMap" class="copy-button"
                    title="Kopieer naar klembord">Kopieer</button>
            </div>
        </div>
    </div>

    <script src="shared.js"></script>
    <script>
        // ============================================================
        // qSOFA Calculator
        // ============================================================
        let currentQsofaText = '';

        function calculateQSOFA() {
            const af_qsofa = parseInt(document.querySelector('input[name="af_qsofa"]:checked').value);
            const mental_qsofa = parseInt(document.querySelector('input[name="mental_qsofa"]:checked').value);
            const sbp_qsofa = parseInt(document.querySelector('input[name="sbp_qsofa"]:checked').value);

            const score = af_qsofa + mental_qsofa + sbp_qsofa;
            currentQsofaText = `qSOFA score = ${score}`;

            document.getElementById('qsofaScore').textContent = currentQsofaText;
            document.getElementById('qsofaResults').classList.add('show');
        }

        document.querySelectorAll('input[name="af_qsofa"], input[name="mental_qsofa"], input[name="sbp_qsofa"]').forEach(radio => {
            radio.addEventListener('change', calculateQSOFA);
        });

        setupCopy('copyButtonQsofa', () => currentQsofaText);

        document.getElementById('resetButtonQsofa').addEventListener('click', function () {
            document.querySelectorAll('input[name="af_qsofa"], input[name="mental_qsofa"], input[name="sbp_qsofa"]').forEach(radio => {
                if (radio.value === "0") radio.checked = true;
            });
            calculateQSOFA();
            showButtonFeedback(this, 'reset-done');
        });

        calculateQSOFA();

        // ============================================================
        // SIRS Calculator
        // ============================================================
        let currentSirsText = '';

        function calculateSIRS() {
            const temp_sirs = parseInt(document.querySelector('input[name="temp_sirs"]:checked').value);
            const hr_sirs = parseInt(document.querySelector('input[name="hr_sirs"]:checked').value);
            const af_sirs = parseInt(document.querySelector('input[name="af_sirs"]:checked').value);
            const leuko_sirs = parseInt(document.querySelector('input[name="leuko_sirs"]:checked').value);

            const score = temp_sirs + hr_sirs + af_sirs + leuko_sirs;
            const interpretation = score < 2 ? '= geen SIRS' : '= wel SIRS';
            currentSirsText = `SIRS score = ${score} ${interpretation}`;

            document.getElementById('sirsScore').textContent = currentSirsText;
            document.getElementById('sirsResults').classList.add('show');
        }

        document.querySelectorAll('input[name="temp_sirs"], input[name="hr_sirs"], input[name="af_sirs"], input[name="leuko_sirs"]').forEach(radio => {
            radio.addEventListener('change', calculateSIRS);
        });

        setupCopy('copyButtonSirs', () => currentSirsText);

        document.getElementById('resetButtonSirs').addEventListener('click', function () {
            document.querySelectorAll('input[name="temp_sirs"], input[name="hr_sirs"], input[name="af_sirs"], input[name="leuko_sirs"]').forEach(radio => {
                if (radio.value === "0") radio.checked = true;
            });
            calculateSIRS();
            showButtonFeedback(this, 'reset-done');
        });

        calculateSIRS();

        // ============================================================
        // Glasgow Coma Scale / EMV Calculator
        // ============================================================
        let currentEmvText = '';

        function calculateEMV() {
            const E = parseInt(document.getElementById('E_emv').value);
            const M = parseInt(document.getElementById('M_emv').value);
            const V = parseInt(document.getElementById('V_emv').value);

            const total = E + M + V;
            currentEmvText = `EMV = E${E} M${M} V${V} (totaal = ${total})`;

            document.getElementById('emvScore').textContent = currentEmvText;
            document.getElementById('emvResults').classList.add('show');
        }

        document.getElementById('E_emv').addEventListener('change', calculateEMV);
        document.getElementById('M_emv').addEventListener('change', calculateEMV);
        document.getElementById('V_emv').addEventListener('change', calculateEMV);

        setupCopy('copyButtonEmv', () => currentEmvText);

        document.getElementById('resetButtonEmv').addEventListener('click', function () {
            document.getElementById('E_emv').selectedIndex = 0;
            document.getElementById('M_emv').selectedIndex = 0;
            document.getElementById('V_emv').selectedIndex = 0;
            calculateEMV();
            showButtonFeedback(this, 'reset-done');
        });

        calculateEMV();

        // ============================================================
        // Mean Arterial Pressure Calculator
        // ============================================================
        let currentMapText = '';

        function calculateMAP() {
            const SBP = parseFloat(document.getElementById('SBPmap').value);
            const DBP = parseFloat(document.getElementById('DBPmap').value);

            if (isNaN(SBP) || isNaN(DBP)) {
                currentMapText = 'MAP = - mmHg';
            } else {
                const map = Math.round((1 / 3) * SBP + (2 / 3) * DBP);
                currentMapText = `MAP = ${map} mmHg`;
            }

            document.getElementById('mapScore').textContent = currentMapText;
            document.getElementById('mapResults').classList.add('show');
        }

        document.getElementById('SBPmap').addEventListener('input', calculateMAP);
        document.getElementById('DBPmap').addEventListener('input', calculateMAP);

        document.getElementById('resetButtonMap').addEventListener('click', function () {
            document.getElementById('SBPmap').value = '';
            document.getElementById('DBPmap').value = '';
            calculateMAP();
            showButtonFeedback(this, 'reset-done');
        });

        setupCopy('copyButtonMap', () => currentMapText);

        calculateMAP();
    </script>
</body>

</html>
