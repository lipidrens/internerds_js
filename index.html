<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vancomycine Dosering Calculator voor Hemodialyse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="wrapper">
        <div class="container">
            <h1>Vancomycine Dosering</h1>

            <form id="calculatorForm">
                <div class="form-group">
                    <label for="weight">Gewicht (kg)</label>
                    <input type="number" id="weight" min="0" step="0.1" required placeholder="Bijv. 70">
                    <div class="error" id="weightError">Voer een geldig gewicht in</div>
                </div>

                <div class="form-group">
                    <label for="timing">Tijdstip van toediening</label>
                    <select id="timing" required>
                        <option value="">-- Selecteer --</option>
                        <option value="na">Na dialyse</option>
                        <option value="tijdens">Tijdens dialyse (laatste 30-60 minuten)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="bridgingPeriod">Aantal dagen tot volgende dialyse/toediening</label>
                    <select id="bridgingPeriod" required>
                        <option value="">-- Selecteer --</option>
                        <option value="2">2 dagen</option>
                        <option value="3">3 dagen</option>
                    </select>
                </div>

                <button type="submit">Bereken dosering</button>
            </form>

            <div class="results" id="results">
                <div class="result-item">
                    <div class="result-label">Oplaaddosis</div>
                    <div class="result-value">
                        <span id="loadingDose">-</span> <span class="unit">mg</span>
                    </div>
                </div>
                <div class="result-item">
                    <div class="result-label">Onderhoudsdosis</div>
                    <div class="result-value">
                        <span id="maintenanceDose">-</span> <span class="unit">mg</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Functie om af te ronden op dichtstbijzijnde veelvoud van 250
        function roundToNearest250(value) {
            return Math.round(value / 250) * 250;
        }

        // Hoofdberekeningsfunctie
        function calculateDoses(weight, timing, bridgingPeriod) {
            let loadingDose, maintenanceDose;
            let maintenancePerKg, maintenanceMax;

            if (timing === 'na') {
                // Na dialyse
                loadingDose = Math.min(25 * weight, 2000);
                maintenancePerKg = 7.5;
                maintenanceMax = 750;
            } else if (timing === 'tijdens') {
                // Tijdens dialyse
                loadingDose = Math.min(35 * weight, 2500);
                maintenancePerKg = 10;
                maintenanceMax = 1000;
            }

            // Verhoog onderhoudsdosis met 25% als overbruggingsperiode 3 dagen is
            if (bridgingPeriod === '3') {
                maintenancePerKg *= 1.25;
                maintenanceMax *= 1.25;
            }

            // Bereken onderhoudsdosis met maximum
            maintenanceDose = Math.min(maintenancePerKg * weight, maintenanceMax);

            // Afronden op dichtstbijzijnde 250
            loadingDose = roundToNearest250(loadingDose);
            maintenanceDose = roundToNearest250(maintenanceDose);

            return {
                loadingDose,
                maintenanceDose
            };
        }

        // Event listener voor formulier
        document.getElementById('calculatorForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const weight = parseFloat(document.getElementById('weight').value);
            const timing = document.getElementById('timing').value;
            const bridgingPeriod = document.getElementById('bridgingPeriod').value;
            const weightError = document.getElementById('weightError');

            // Validatie
            if (!weight || weight <= 0) {
                weightError.classList.add('show');
                return;
            } else {
                weightError.classList.remove('show');
            }

            if (!timing || !bridgingPeriod) {
                return;
            }

            // Bereken doseringen
            const doses = calculateDoses(weight, timing, bridgingPeriod);

            // Toon resultaten
            document.getElementById('loadingDose').textContent = doses.loadingDose;
            document.getElementById('maintenanceDose').textContent = doses.maintenanceDose;
            document.getElementById('results').classList.add('show');
        });

        // Reset error bij input wijziging
        document.getElementById('weight').addEventListener('input', function () {
            document.getElementById('weightError').classList.remove('show');
        });
    </script>
</body>

</html>
