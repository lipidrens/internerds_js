<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vancomycine Dosering Calculator voor Hemodialyse</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            /* background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); *\
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .results {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            display: none;
        }

        .results.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-item {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        .result-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .result-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .result-value {
            color: #333;
            font-size: 24px;
            font-weight: 700;
        }

        .unit {
            font-size: 18px;
            color: #666;
            font-weight: 500;
        }

        .error {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .disclaimer {
            margin-top: 20px;
            padding: 15px;
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            border-radius: 4px;
            font-size: 12px;
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Vancomycine Dosering</h1>
        <p class="subtitle">Calculator voor hemodialyse patiënten</p>

        <form id="calculatorForm">
            <div class="form-group">
                <label for="weight">Gewicht (kg)</label>
                <input type="number" id="weight" min="0" step="0.1" required placeholder="Bijv. 70">
                <div class="error" id="weightError">Voer een geldig gewicht in</div>
            </div>

            <div class="form-group">
                <label for="timing">Tijdstip van toediening</label>
                <select id="timing" required>
                    <option value="">-- Selecteer --</option>
                    <option value="na">Na dialyse</option>
                    <option value="tijdens">Tijdens dialyse (laatste 30-60 minuten)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="bridgingPeriod">Aantal dagen tot volgende dialyse/toediening</label>
                <select id="bridgingPeriod" required>
                    <option value="">-- Selecteer --</option>
                    <option value="2">2 dagen</option>
                    <option value="3">3 dagen</option>
                </select>
            </div>

            <button type="submit">Bereken dosering</button>
        </form>

        <div class="results" id="results">
            <div class="result-item">
                <div class="result-label">Oplaaddosis</div>
                <div class="result-value">
                    <span id="loadingDose">-</span> <span class="unit">mg</span>
                </div>
            </div>
            <div class="result-item">
                <div class="result-label">Onderhoudsdosis</div>
                <div class="result-value">
                    <span id="maintenanceDose">-</span> <span class="unit">mg</span>
                </div>
            </div>
        </div>

        <div class="disclaimer">
            <strong>Let op:</strong> Deze calculator is bedoeld als hulpmiddel. Controleer altijd de uitkomst en volg de lokale protocollen en richtlijnen.
        </div>
    </div>

    <script>
        // Functie om af te ronden op dichtstbijzijnde veelvoud van 250
        function roundToNearest250(value) {
            return Math.round(value / 250) * 250;
        }

        // Hoofdberekeningsfunctie
        function calculateDoses(weight, timing, bridgingPeriod) {
            let loadingDose, maintenanceDose;
            let maintenancePerKg, maintenanceMax;

            if (timing === 'na') {
                // Na dialyse
                loadingDose = Math.min(25 * weight, 2000);
                maintenancePerKg = 7.5;
                maintenanceMax = 750;
            } else if (timing === 'tijdens') {
                // Tijdens dialyse
                loadingDose = Math.min(35 * weight, 2500);
                maintenancePerKg = 10;
                maintenanceMax = 1000;
            }

            // Verhoog onderhoudsdosis met 25% als overbruggingsperiode 3 dagen is
            if (bridgingPeriod === '3') {
                maintenancePerKg *= 1.25;
                maintenanceMax *= 1.25;
            }

            // Bereken onderhoudsdosis met maximum
            maintenanceDose = Math.min(maintenancePerKg * weight, maintenanceMax);

            // Afronden op dichtstbijzijnde 250
            loadingDose = roundToNearest250(loadingDose);
            maintenanceDose = roundToNearest250(maintenanceDose);

            return {
                loadingDose,
                maintenanceDose
            };
        }

        // Event listener voor formulier
        document.getElementById('calculatorForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const weight = parseFloat(document.getElementById('weight').value);
            const timing = document.getElementById('timing').value;
            const bridgingPeriod = document.getElementById('bridgingPeriod').value;
            const weightError = document.getElementById('weightError');

            // Validatie
            if (!weight || weight <= 0) {
                weightError.classList.add('show');
                return;
            } else {
                weightError.classList.remove('show');
            }

            if (!timing || !bridgingPeriod) {
                return;
            }

            // Bereken doseringen
            const doses = calculateDoses(weight, timing, bridgingPeriod);

            // Toon resultaten
            document.getElementById('loadingDose').textContent = doses.loadingDose;
            document.getElementById('maintenanceDose').textContent = doses.maintenanceDose;
            document.getElementById('results').classList.add('show');
        });

        // Reset error bij input wijziging
        document.getElementById('weight').addEventListener('input', function() {
            document.getElementById('weightError').classList.remove('show');
        });
    </script>
</body>
</html>
