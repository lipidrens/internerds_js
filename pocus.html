                <div class="inline-fields">

    <script src="shared.js"></script>
    <script>
        // ── Keuzelijsten ──────────────────────────────────────────────────────
        const LONG1 = [{
            group: 'Lung sliding',
            items: ['Lung sliding: ja', 'Lung sliding: nee', 'Lung pulse: ja', 'Lung pulse: nee',
                'Lung point: ja', 'Lung sliding: niet te beoordelen']
        }];

        const LONG2 = [{
            group: 'A/B-patroon',
            items: ['A-lijnen', '1-2 B-lijnen', '3-4 B-lijnen', '>4 B-lijnen, afzonderlijk',
                'B-lijnen, confluerend', 'Z-lijnen']
        }];

        const LONG3 = [
            { group: 'Pleura', items: ['Pleura: regulair', 'Pleura: irregulair'] },
            {
                group: 'Consolidatie',
                items: ['Subpleurale consolidatie', 'Shred-sign', 'Consolidatie',
                    'Consolidatie met luchtbronchogram', 'Consolidatie met statisch luchtbronchogram',
                    'Consolidatie met dynamisch luchtbronchogram']
            },
            {
                group: 'PLAPS',
                items: ['Spine sign: nee', 'Spine sign: ja', 'Mirror sign: ja', 'Mirror sign: nee',
                    'Curtain sign: ja', 'Curtain sign: nee', 'Pleuravocht: afwezig', 'Pleuravocht: spoor',
                    'Pleuravocht: ja', 'Pleuravocht: ja, met plankton sign', 'Jellyfish sign: nee',
                    'Jellyfish sign: ja', 'Geconsolideerde long']
            }
        ];

        // Zones 4 zijn de PLAPS-punten: daar staan de PLAPS-opties bovenaan
        const LONG3_PLAPS = LONG3.slice().reverse();

        const NIER = [
            {
                group: 'Hydronefrose',
                items: ['Geen hydronefrose', 'Wel hydronefrose, mild (graad 1)',
                    'Wel hydronefrose, matig (graad 2)', 'Wel hydronefrose, matig (graad 3)',
                    'Wel hydronefrose, ernstig (graad 4)']
            },
            { group: 'Overige bevindingen', items: ['Nefrolithiasis', 'Niercysten', 'Schrompelnier', 'Niertumor'] }
        ];

        // Longzones: idem = "zie <andere zone>"
        const ZONES_R = [
            { id: 'R1', idem: null }, { id: 'R2', idem: 'R1' }, { id: 'R3', idem: 'R2' },
            { id: 'R4', idem: null, plaps: true }, { id: 'R5', idem: 'R1' }, { id: 'R6', idem: 'R5' }
        ];
        const ZONES_L = [
            { id: 'L1', idem: 'R1' }, { id: 'L2', idem: 'L1' }, { id: 'L3', idem: 'L2' },
            { id: 'L4', idem: 'R4', plaps: true }, { id: 'L5', idem: 'L1' }, { id: 'L6', idem: 'L5' }
        ];
        const ZONES = ZONES_R.concat(ZONES_L);
        const ZONE_BY_ID = {};
        ZONES.forEach(z => { ZONE_BY_ID[z.id] = z; });

        // ── Tagselect: meerkeuze met vrije invoer (vervangt selectizeInput) ────
        const TS = {};

        function toOption(opt) {
            return typeof opt === 'string'
                ? { value: opt, label: opt }
                : { value: opt.value, label: opt.label || opt.value };
        }

        function flattenOptions(options) {
            const out = [];
            (options || []).forEach(opt => {
                if (opt && opt.group) {
                    opt.items.forEach(item => {
                        const o = toOption(item);
                        o.group = opt.group;
                        out.push(o);
                    });
                } else {
                    out.push(toOption(opt));
                }
            });
            return out;
        }

        function createTagSelect(key, config) {
            const mount = document.getElementById('ts_' + key);
            const options = flattenOptions(config.options);
            const defaults = (config.selected || []).slice();
            const placeholder = config.placeholder || 'Kies of typ...';
            let values = defaults.slice();
            let rows = [];
            let activeIndex = 0;

            const wrap = document.createElement('div');
            wrap.className = 'tagselect';
            const control = document.createElement('div');
            control.className = 'tagselect-control';
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'tagselect-input';
            input.autocomplete = 'off';
            const dropdown = document.createElement('div');
            dropdown.className = 'tagselect-dropdown';
            control.appendChild(input);
            wrap.appendChild(control);
            wrap.appendChild(dropdown);
            mount.appendChild(wrap);

            function labelFor(value) {
                const found = options.find(o => o.value === value);
                return found ? found.label : value;
            }

            function renderChips() {
                Array.from(control.querySelectorAll('.tagselect-chip')).forEach(chip => chip.remove());
                values.forEach(value => {
                    const chip = document.createElement('span');
                    chip.className = 'tagselect-chip';
                    chip.appendChild(document.createTextNode(labelFor(value)));
                    const del = document.createElement('button');
                    del.type = 'button';
                    del.className = 'tagselect-chip-remove';
                    del.textContent = '×';
                    del.title = 'Verwijder';
                    del.addEventListener('mousedown', event => {
                        event.preventDefault();
                        event.stopPropagation();
                        removeValue(value);
                    });
                    chip.appendChild(del);
                    control.insertBefore(chip, input);
                });
                input.placeholder = values.length ? '' : placeholder;
            }

            function renderOptions() {
                const typed = input.value.trim();
                const query = typed.toLowerCase();
                dropdown.textContent = '';
                rows = [];
                let lastGroup = null;

                options
                    .filter(o => values.indexOf(o.value) === -1 && (!query || o.label.toLowerCase().includes(query)))
                    .forEach(o => {
                        if (o.group && o.group !== lastGroup) {
                            const head = document.createElement('div');
                            head.className = 'tagselect-group';
                            head.textContent = o.group;
                            dropdown.appendChild(head);
                        }
                        lastGroup = o.group || null;
                        rows.push({ el: addRow(o.label, o.value), value: o.value });
                    });

                const known = options.some(o => o.label.toLowerCase() === query) ||
                    values.some(v => v.toLowerCase() === query);
                if (config.create !== false && typed && !known) {
                    const row = addRow('+ ' + typed, typed);
                    row.classList.add('tagselect-create');
                    rows.push({ el: row, value: typed });
                }

                if (!rows.length) {
                    const empty = document.createElement('div');
                    empty.className = 'tagselect-empty';
                    empty.textContent = 'Geen opties';
                    dropdown.appendChild(empty);
                }

                if (activeIndex > rows.length - 1) activeIndex = rows.length - 1;
                if (activeIndex < 0) activeIndex = 0;
                highlight();
            }

            function addRow(text, value) {
                const row = document.createElement('div');
                row.className = 'tagselect-option';
                row.textContent = text;
                row.addEventListener('mousedown', event => {
                    event.preventDefault();
                    addValue(value);
                });
                dropdown.appendChild(row);
                return row;
            }

            function highlight() {
                rows.forEach((row, i) => row.el.classList.toggle('active', i === activeIndex));
                const current = rows[activeIndex];
                if (!current) return;
                const top = current.el.offsetTop;
                const bottom = top + current.el.offsetHeight;
                if (top < dropdown.scrollTop) dropdown.scrollTop = top;
                else if (bottom > dropdown.scrollTop + dropdown.clientHeight)
                    dropdown.scrollTop = bottom - dropdown.clientHeight;
            }

            function open() {
                wrap.classList.add('open');
                renderOptions();
            }

            function close() {
                wrap.classList.remove('open');
                input.value = '';
            }

            function addValue(value) {
                if (values.indexOf(value) === -1) values.push(value);
                input.value = '';
                activeIndex = 0;
                renderChips();
                renderOptions();
                input.focus();
                generateReport();
            }

            function removeValue(value) {
                values = values.filter(v => v !== value);
                renderChips();
                renderOptions();
                generateReport();
            }

            control.addEventListener('mousedown', event => {
                if (event.target === control || event.target.classList.contains('tagselect-chip')) {
                    event.preventDefault();
                    input.focus();
                }
            });
            input.addEventListener('focus', open);
            input.addEventListener('input', () => { activeIndex = 0; open(); });
            input.addEventListener('keydown', event => {
                if (event.key === 'ArrowDown') {
                    event.preventDefault();
                    if (!wrap.classList.contains('open')) open();
                    else { activeIndex = Math.min(activeIndex + 1, rows.length - 1); highlight(); }
                } else if (event.key === 'ArrowUp') {
                    event.preventDefault();
                    activeIndex = Math.max(activeIndex - 1, 0);
                    highlight();
                } else if (event.key === 'Enter') {
                    event.preventDefault();
                    if (rows[activeIndex]) addValue(rows[activeIndex].value);
                } else if (event.key === 'Escape') {
                    close();
                } else if (event.key === 'Backspace' && !input.value && values.length) {
                    removeValue(values[values.length - 1]);
                }
            });
            wrap.addEventListener('focusout', event => {
                if (!wrap.contains(event.relatedTarget)) close();
            });

            const api = {
                get values() { return values.slice(); },
                set: function (next) {
                    values = (next || []).filter(v => v !== '');
                    renderChips();
                    renderOptions();
                },
                reset: function () { api.set(defaults.slice()); }
            };
            renderChips();
            TS[key] = api;
            return api;
        }

        // ── Longzones opbouwen ────────────────────────────────────────────────
        function buildZones(hostId, zones) {
            const host = document.getElementById(hostId);
            zones.forEach(zone => {
                const row = document.createElement('div');
                row.className = 'lung-zone';

                const select = document.createElement('select');
                select.id = zone.id + '_status';
                const statusOptions = [['adequaat', zone.id + ':']];
                if (zone.idem) statusOptions.push(['idem', zone.id + ': zie ' + zone.idem]);
                statusOptions.push(['ntb', zone.id + ': ntb']);
                statusOptions.forEach(([value, label]) => {
                    const option = document.createElement('option');
                    option.value = value;
                    option.textContent = label;
                    select.appendChild(option);
                });
                row.appendChild(select);

                ['1', '2', '3'].forEach(nr => {
                    const mount = document.createElement('div');
                    mount.id = 'ts_' + zone.id + '_long' + nr;
                    row.appendChild(mount);
                });
                host.appendChild(row);
            });

            zones.forEach(zone => {
                createTagSelect(zone.id + '_long1', { options: LONG1, placeholder: 'Sliding...' });
                createTagSelect(zone.id + '_long2', { options: LONG2, placeholder: 'A/B...' });
                createTagSelect(zone.id + '_long3', {
                    options: zone.plaps ? LONG3_PLAPS : LONG3,
                    placeholder: 'Pleura / PLAPS...'
                });
            });
        }

        buildZones('zonesRechts', ZONES_R);
        buildZones('zonesLinks', ZONES_L);

        // ── Overige keuzevelden ───────────────────────────────────────────────
        createTagSelect('vraag_echo', {
            options: ['vullingsstatus?', 'oorzaak shock?', 'oorzaak dyspneu?']
        });
        createTagSelect('vraag_cor', {
            options: ['linkerventrikelfunctie?', 'rechtsoverbelasting?', 'pericardvocht?']
        });
        createTagSelect('beelden_cor', {
            options: ['PSAX', 'PLAX', 'A4CH', 'A3CH', 'A2CH', 'S4CH', 'SSAX', 'SIVC'],
            selected: ['PSAX', 'PLAX', 'A4CH', 'S4CH']
        });
        createTagSelect('lvf_cor', { options: ['hyperdynamisch', 'goed', 'verminderd', 'slecht'] });
        createTagSelect('rechtsbelasting_cor', {
            options: [
                { group: 'PLAX', items: ['RVOT vergroot: nee', 'RVOT vergroot: ja'] },
                { group: 'PSAX', items: ['D-sign: nee', 'D-sign: ja'] },
                {
                    group: 'A4CH',
                    items: ['RV groter dan LV: nee', 'RV groter dan LV: ja', 'McConnel sign: nee',
                        'McConnel sign: ja', 'Bulging septum in A4CH: nee', 'Bulging septum in A4CH: ja']
                }
            ]
        });
        createTagSelect('rvf_cor', { options: ['goed', 'verminderd'] });
        createTagSelect('pericardvocht_cor', {
            options: ['Pericardvocht: ja', 'Pericardvocht: nee', 'Pericardvet']
        });
        createTagSelect('conclusie_cor', {
            options: [
                {
                    group: 'Linkerventrikelfunctie',
                    items: ['Linkerventrikelfunctie hyperdynamisch', 'Linkerventrikelfunctie niet evident afwijkend',
                        'Linkerventrikelfunctie verminderd']
                },
                { group: 'Rechtsbelasting', items: ['Geen tekenen van rechtsbelasting', 'Tekenen van rechtsbelasting'] },
                { group: 'Pericardvocht', items: ['Geen significant pericardvocht', 'Significant pericardvocht'] }
            ]
        });
        createTagSelect('vraag_vci', { options: ['diameter en collaps VCI?'] });
        createTagSelect('conclusie_vci', {
            options: [
                { value: '!cvd', label: 'Lage / intermediaire / hoge CVD o.b.v. spontane collaps (automatisch, cutoff 1.5-2-2.5 cm)' },
                { value: '!RA', label: 'Schatting RA-druk o.b.v. sniff-test (automatisch, cutoff 2.1 cm)' }
            ],
            selected: ['!cvd']
        });
        createTagSelect('vraag_long', {
            options: ['oorzaak dyspneu?', 'overvulling?', 'pneumothorax?', 'pleuravocht?', 'consolidatie?']
        });
        createTagSelect('conclusie_long', {
            options: [
                {
                    group: 'BLUE-protocol',
                    items: ['A-profiel met normale PLAPS', 'A-profiel met afwijkende PLAPS', 'B-profiel',
                        "B'-profiel", 'A/B-profiel', 'C-profiel', "A'-profiel met lung point"]
                },
                {
                    group: 'Diagnose',
                    items: ['Bij longechografie geen afwijkende bevindingen', 'Longechografie passend bij longoedeem',
                        'Longechografie passend bij pneumonie', 'Longechografie passend bij pneumothorax',
                        'Longechografie passend bij astma/COPD', 'Longechografie passend bij atelectase',
                        'Longechografie passend bij pleuravocht', 'Longechografie passend bij empyeem']
                }
            ]
        });
        createTagSelect('vraag_nier', {
            options: ['hydronefrose?', 'niergrootte?', 'urineretentie?', 'post-renale obstructie?']
        });
        createTagSelect('hrechts_nier', { options: NIER });
        createTagSelect('hlinks_nier', { options: NIER });
        createTagSelect('htrans_nier', { options: NIER });
        createTagSelect('conclusie_nier', {
            options: ['Geen hydronefrose', 'Hydronefrose rechts', 'Hydronefrose links', 'Hydronefrose bilateraal',
                { value: '!volume', label: 'Geschat blaasvolume (automatisch)' }],
            selected: ['!volume']
        });

        // ── Hulpfuncties ──────────────────────────────────────────────────────
        const KWALITEIT_NOOT = ' (echter beelden van onvoldoende kwaliteit voor zekere uitspraak)';

        function values(key) {
            return TS[key].values;
        }

        function text(id) {
            return document.getElementById(id).value.trim();
        }

        function number(id) {
            const raw = text(id);
            return raw === '' ? NaN : parseFloat(raw);
        }

        function selected(id) {
            return document.getElementById(id).value;
        }

        function radio(name) {
            const checked = document.querySelector('input[name="' + name + '"]:checked');
            return checked ? checked.value : '';
        }

        function join(parts, separator) {
            return parts.filter(part => part !== '' && part !== null && part !== undefined).join(separator);
        }

        function withQuality(conclusie, quality) {
            return conclusie && quality === 'onvoldoende' ? conclusie + KWALITEIT_NOOT : conclusie;
        }

        function collapsText(diameter, max) {
            if (isNaN(max) || !max) return '';
            return ' (collaps ' + Math.round(100 - diameter / max * 100) + '%)';
        }

        // ── Verslag genereren ─────────────────────────────────────────────────
        function generateReport() {
            // Echografist
            const algemeenRegels = [];
            const naam = text('naam_echo');
            if (naam) {
                const supervisor = text('supervisor_echo');
                const supervisie = supervisor
                    ? ' (onder ' + selected('suptype_echo') + ' supervisie van ' + supervisor + ')'
                    : '';
                algemeenRegels.push('POCUS verricht door ' + naam + supervisie);
            }

            // Hart
            let cor = '';
            let conclusieCor = '';
            const lvf = values('lvf_cor');
            const rvf = values('rvf_cor');
            const rechtsbelasting = values('rechtsbelasting_cor');
            const pericardvocht = values('pericardvocht_cor');
            const conclusiesCor = values('conclusie_cor');
            const epss = number('epss_cor');
            const tapse = number('tapse_cor');
            const pericardschil = number('pericardschil_cor');
            const overigCor = text('overig_cor');
            const qualityCor = radio('quality_cor');

            if (values('vraag_cor').length || lvf.length || !isNaN(epss) || rvf.length || rechtsbelasting.length ||
                !isNaN(tapse) || pericardvocht.length || !isNaN(pericardschil) || overigCor || conclusiesCor.length) {
                const regels = ['Hart: Beeldkwaliteit: ' + qualityCor +
                    '. Verkregen beelden: ' + values('beelden_cor').join('; ') + '.'];
                regels.push(join([
                    lvf.length ? 'Linkerventrikelfunctie: ' + lvf.join('; ') + '.' : '',
                    isNaN(epss) ? '' : 'EPSS: ' + epss + ' mm.'
                ], ' '));
                regels.push(rechtsbelasting.length ? 'Rechterventrikel: ' + rechtsbelasting.join('; ') + '.' : '');
                regels.push(join([
                    rvf.length ? 'Rechterventrikelfunctie: ' + rvf.join('; ') + '.' : '',
                    isNaN(tapse) ? '' : 'TAPSE: ' + tapse + ' mm.'
                ], ' '));
                regels.push(join([
                    pericardvocht.length ? pericardvocht.join('. ') + '.' : '',
                    isNaN(pericardschil) ? '' : 'Dikte van schil: ' + pericardschil + ' cm.'
                ], ' '));
                regels.push(overigCor ? 'Overige bevindingen: ' + overigCor + '.' : '');
                cor = join(regels, '\n');
                conclusieCor = withQuality(conclusiesCor.join('. '), qualityCor);
            }

            // VCI
            let vci = '';
            let conclusieVci = '';
            const maxVci = number('max_vci');
            const minVci = number('min_vci');
            const sniffVci = number('sniff_vci');
            const sniffMethode = selected('sniffmethode_vci');
            const conclusiesVci = values('conclusie_vci');
            const qualityVci = radio('quality_vci');

            if (!isNaN(maxVci) || conclusiesVci.some(v => v !== '!cvd')) {
                const metingen = [];
                if (!isNaN(maxVci)) metingen.push('maximale diameter: ' + maxVci + ' cm');

                let collapsDeel = '';
                if (!isNaN(minVci) || sniffMethode !== 'gemeten' || !isNaN(sniffVci)) collapsDeel = 'minimale diameter';
                if (!isNaN(minVci)) {
                    collapsDeel += ' bij respiratie: ' + minVci + ' cm' + collapsText(minVci, maxVci);
                }
                let sniffDeel = '';
                if (sniffMethode === 'gemeten') {
                    if (!isNaN(sniffVci)) sniffDeel = ' bij sniffen: ' + sniffVci + ' cm' + collapsText(sniffVci, maxVci);
                } else {
                    sniffDeel = ' bij sniffen collaps ' + sniffMethode;
                }
                if (!isNaN(minVci) && sniffDeel) sniffDeel = ';' + sniffDeel;
                collapsDeel += sniffDeel;
                if (collapsDeel) metingen.push(collapsDeel);

                let meting = metingen.join('; ');
                if (meting) meting = meting.charAt(0).toUpperCase() + meting.slice(1) + '.';
                vci = join(['VCI: Beeldkwaliteit: ' + qualityVci + '.', meting], '\n');

                const conclusies = conclusiesVci.map(conclusie => {
                    if (conclusie === '!cvd') {
                        if (isNaN(maxVci) || isNaN(minVci)) return '';
                        const collaps = 100 - minVci / maxVci * 100;
                        if (maxVci <= 1.5 || (maxVci <= 2 && collaps >= 50 && collaps <= 100))
                            return 'VCI passend bij lage CVD';
                        if (maxVci >= 2.5 || (maxVci >= 2 && collaps < 50 && collaps >= 0))
                            return 'VCI passend bij hoge CVD';
                        return 'VCI passend bij intermediaire CVD';
                    }
                    if (conclusie === '!RA') {
                        let collaps = null;
                        if (sniffMethode === 'gemeten' && !isNaN(sniffVci) && !isNaN(maxVci))
                            collaps = 100 - sniffVci / maxVci * 100 >= 50;
                        else if (sniffMethode === 'gemeten' && !isNaN(minVci) && !isNaN(maxVci))
                            collaps = 100 - minVci / maxVci * 100 >= 50;
                        else if (sniffMethode === '<50%') collaps = false;
                        else if (sniffMethode === '>50%') collaps = true;
                        if (isNaN(maxVci) || collaps === null) return '';
                        if (maxVci <= 2.1 && collaps) return 'Geschatte RA druk: normaal (3 mmHg, range 0-5)';
                        if (maxVci > 2.1 && !collaps) return 'Geschatte RA druk: verhoogd (15 mmHg, range 10-20)';
                        return 'Geschatte RA druk: intermediair (8 mmHg, range 5-10)';
                    }
                    return conclusie;
                });
                conclusieVci = withQuality(join(conclusies, '. '), qualityVci);
            }

            // Longen
            let long = '';
            let conclusieLong = '';
            const zoneBevindingen = {};
            ZONES.forEach(zone => {
                zoneBevindingen[zone.id] = [].concat(
                    values(zone.id + '_long1'),
                    values(zone.id + '_long2'),
                    values(zone.id + '_long3')
                ).join('; ');
            });

            function zoneText(id, bezocht) {
                const zone = ZONE_BY_ID[id];
                if (selected(id + '_status') === 'idem' && zone.idem && bezocht.indexOf(id) === -1) {
                    return zoneText(zone.idem, bezocht.concat(id));
                }
                return zoneBevindingen[id];
            }

            const conclusiesLong = values('conclusie_long');
            const qualityLong = radio('quality_long');
            const zoneRegels = ZONES.map(zone => {
                if (selected(zone.id + '_status') === 'ntb') return zone.id + ': niet te beoordelen';
                const bevinding = zoneText(zone.id, []);
                return bevinding ? zone.id + ': ' + bevinding + '.' : '';
            });

            if (ZONES.some(zone => zoneBevindingen[zone.id]) || conclusiesLong.length) {
                long = join(['Longen: Beeldkwaliteit: ' + qualityLong + '.'].concat(zoneRegels), '\n');
                conclusieLong = withQuality(conclusiesLong.join('. '), qualityLong);
            }

            // Nieren en blaas
            let nier = '';
            let conclusieNier = '';
            const rechterNier = values('hrechts_nier');
            const linkerNier = values('hlinks_nier');
            const transplantaat = values('htrans_nier');
            const grootteRechts = number('grechts_nier');
            const grootteLinks = number('glinks_nier');
            const grootteTrans = number('gtrans_nier');
            const hoogte = number('hoogte_blaas');
            const diepte = number('diepte_blaas');
            const breedte = number('breedte_blaas');
            const correctie = number('cor_blaas');
            const overigNier = text('overig_nier');
            const conclusiesNier = values('conclusie_nier');
            const qualityNier = radio('quality_nier');

            if (rechterNier.length || linkerNier.length || transplantaat.length || !isNaN(grootteRechts) ||
                !isNaN(grootteLinks) || !isNaN(grootteTrans) || !isNaN(hoogte) || !isNaN(diepte) || !isNaN(breedte) ||
                overigNier || conclusiesNier.some(v => v !== '!volume')) {
                const nierRegel = (label, bevindingen, grootte) => {
                    const delen = bevindingen.slice();
                    if (!isNaN(grootte)) delen.push('Grootte: ' + grootte + ' cm');
                    return delen.length ? label + ': ' + delen.join('; ') + '.' : '';
                };
                const regels = ['Nieren en blaas: Beeldkwaliteit: ' + qualityNier + '.'];
                regels.push(nierRegel('Rechter nier', rechterNier, grootteRechts));
                regels.push(nierRegel('Linker nier', linkerNier, grootteLinks));
                regels.push(nierRegel('Transplantaat', transplantaat, grootteTrans));

                let blaas = '';
                if (!isNaN(hoogte) && !isNaN(diepte) && !isNaN(breedte)) {
                    blaas = 'Hoogte (cran-caud): ' + hoogte + ' cm; Diepte (ant-post): ' + diepte +
                        ' cm; Breedte (lat-lat): ' + breedte + ' cm';
                    if (!isNaN(correctie)) blaas += '; Correctiefactor: ' + correctie;
                    blaas = 'Blaas: ' + blaas + '.';
                }
                regels.push(blaas);
                regels.push(overigNier ? 'Overige bevindingen: ' + overigNier + '.' : '');
                nier = join(regels, '\n');

                const conclusies = conclusiesNier.map(conclusie => {
                    if (conclusie !== '!volume') return conclusie;
                    if (isNaN(hoogte) || isNaN(diepte) || isNaN(breedte) || isNaN(correctie)) return '';
                    return 'Geschat blaasvolume: ' + Math.round(hoogte * diepte * breedte * correctie) + ' ml';
                });
                conclusieNier = withQuality(join(conclusies, '. '), qualityNier);
            }

            // Vraagstelling
            const vraagstelling = join([
                values('vraag_echo').join(' '),
                cor ? values('vraag_cor').join(' ') : '',
                vci ? values('vraag_vci').join(' ') : '',
                long ? values('vraag_long').join(' ') : '',
                nier ? values('vraag_nier').join(' ') : ''
            ], ' ');
            if (vraagstelling) algemeenRegels.push('Vraagstelling: ' + vraagstelling);
            const algemeen = algemeenRegels.join('\n');

            // Afsluiting
            const conclusie = join([conclusieCor, conclusieVci, conclusieLong, conclusieNier, text('conclusie_echo')], '. ');
            const opmerkingen = text('opm_echo');
            const afsluiting = join([
                conclusie ? 'Conclusie: ' + conclusie + '.' : '',
                opmerkingen ? 'Opmerkingen: ' + opmerkingen : ''
            ], '\n');

            document.getElementById('verslagOutput').value = join([algemeen, cor, vci, long, nier, afsluiting], '\n\n');
        }

        // ── Events ────────────────────────────────────────────────────────────
        const wrapper = document.querySelector('.wrapper');
        wrapper.addEventListener('input', generateReport);
        wrapper.addEventListener('change', generateReport);

        document.getElementById('vorm_blaas').addEventListener('change', function () {
            if (this.value === 'bolvormig') document.getElementById('cor_blaas').value = '0.52';
            else if (this.value === 'onbekend') document.getElementById('cor_blaas').value = '0.72';
        });

        setupCopy('copyVerslag', () => document.getElementById('verslagOutput').value);

        function resetFields(spec) {
            (spec.tags || []).forEach(key => TS[key].reset());
            (spec.clear || []).forEach(id => { document.getElementById(id).value = ''; });
            Object.keys(spec.set || {}).forEach(id => { document.getElementById(id).value = spec.set[id]; });
            Object.keys(spec.radios || {}).forEach(name => {
                const option = document.querySelector('input[name="' + name + '"][value="' + spec.radios[name] + '"]');
                if (option) option.checked = true;
            });
            generateReport();
        }

        const zoneTags = [];
        const zoneStatus = {};
        ZONES.forEach(zone => {
            zoneTags.push(zone.id + '_long1', zone.id + '_long2', zone.id + '_long3');
            zoneStatus[zone.id + '_status'] = 'adequaat';
        });

        const RESETS = {
            resetEcho: {
                tags: ['vraag_echo'],
                clear: ['naam_echo', 'supervisor_echo', 'conclusie_echo', 'opm_echo'],
                set: { suptype_echo: 'indirecte' }
            },
            resetCor: {
                tags: ['vraag_cor', 'beelden_cor', 'lvf_cor', 'rechtsbelasting_cor', 'rvf_cor',
                    'pericardvocht_cor', 'conclusie_cor'],
                clear: ['epss_cor', 'tapse_cor', 'pericardschil_cor', 'overig_cor'],
                radios: { quality_cor: 'voldoende' }
            },
            resetVci: {
                tags: ['vraag_vci', 'conclusie_vci'],
                clear: ['max_vci', 'min_vci', 'sniff_vci'],
                set: { sniffmethode_vci: 'gemeten' },
                radios: { quality_vci: 'voldoende' }
            },
            resetLong: {
                tags: ['vraag_long', 'conclusie_long'].concat(zoneTags),
                set: zoneStatus,
                radios: { quality_long: 'voldoende' }
            },
            resetNier: {
                tags: ['vraag_nier', 'hrechts_nier', 'hlinks_nier', 'htrans_nier', 'conclusie_nier'],
                clear: ['grechts_nier', 'glinks_nier', 'gtrans_nier', 'hoogte_blaas', 'diepte_blaas',
                    'breedte_blaas', 'overig_nier'],
                set: { vorm_blaas: 'bolvormig', cor_blaas: '0.52' },
                radios: { quality_nier: 'voldoende' }
            }
        };

        Object.keys(RESETS).forEach(buttonId => {
            document.getElementById(buttonId).addEventListener('click', function () {
                resetFields(RESETS[buttonId]);
                showButtonFeedback(this, 'reset-done');
            });
        });

        // Algemene reset vraagt een tweede klik, zodat een volledig verslag niet per ongeluk verdwijnt
        const RESET_ALL_LABEL = 'Alles resetten';
        let resetAllTimer = null;

        function disarmResetAll(button) {
            clearTimeout(resetAllTimer);
            resetAllTimer = null;
            button.textContent = RESET_ALL_LABEL;
            button.classList.remove('reset-confirm');
        }

        document.getElementById('resetAll').addEventListener('click', function () {
            if (!resetAllTimer) {
                this.textContent = 'Klik nogmaals om alles te wissen';
                this.classList.add('reset-confirm');
                resetAllTimer = setTimeout(() => disarmResetAll(this), 3000);
                return;
            }
            disarmResetAll(this);
            Object.keys(RESETS).forEach(buttonId => resetFields(RESETS[buttonId]));
            showButtonFeedback(this, 'reset-done');
        });

        generateReport();
    </script>
</body>
