<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Template</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="wrapper">
        <!-- Calculator 1 -->
        <div class="container">
            <h1>Calculator Titel</h1>
            <p class="subtitle">Beschrijving van de calculator</p>

            <form id="calculatorForm1">
                <div class="form-group">
                    <label for="input1">Input label</label>
                    <input type="number" id="input1" min="0" step="0.1" required placeholder="Bijv. 70">
                    <div class="error" id="input1Error">Voer een geldige waarde in</div>
                </div>

                <!-- Voeg meer inputs toe indien nodig -->

                <!-- Voor radio buttons gebruik deze structuur:
                <div class="form-group">
                    <label>Optie label</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="option1" value="0" checked>
                            Optie 1
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="option1" value="1">
                            Optie 2
                        </label>
                    </div>
                </div>
                -->
            </form>

            <div class="results show" id="results1">
                <div class="result-item">
                    <div class="result-value">
                        <span id="result1">Resultaat = -</span>
                    </div>
                </div>
            </div>
            <div class="button-container">
                <button type="button" id="resetButton1" class="reset-button">Reset</button>
                <button type="button" id="copyButton1" class="copy-button"
                    title="Kopieer naar klembord">Kopieer</button>
            </div>
        </div>

        <!-- Calculator 2 (optioneel - verwijder indien niet nodig) -->
        <div class="container">
            <h1>Calculator Titel 2</h1>
            <p class="subtitle">Beschrijving van de calculator</p>

            <form id="calculatorForm2">
                <div class="form-group">
                    <label for="input2">Input label</label>
                    <input type="number" id="input2" min="0" step="0.1" required placeholder="Bijv. 70">
                    <div class="error" id="input2Error">Voer een geldige waarde in</div>
                </div>
            </form>

            <div class="results show" id="results2">
                <div class="result-item">
                    <div class="result-value">
                        <span id="result2">Resultaat = -</span>
                    </div>
                </div>
            </div>
            <div class="button-container">
                <button type="button" id="resetButton2" class="reset-button">Reset</button>
                <button type="button" id="copyButton2" class="copy-button"
                    title="Kopieer naar klembord">Kopieer</button>
            </div>
        </div>
    </div>

    <script>
        // Helper function for copy feedback
        function showCopyFeedback(btn) {
            const originalIcon = btn.textContent;
            btn.textContent = '✓';
            btn.classList.add('copied');
            setTimeout(() => {
                btn.textContent = originalIcon;
                btn.classList.remove('copied');
            }, 1500);
        }

        // Fallback copy function for browsers/iframes that don't support clipboard API
        function fallbackCopyText(text, btn) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.className = 'clipboard-helper';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showCopyFeedback(btn);
                } else {
                    console.error('Fallback kopiëren mislukt');
                }
            } catch (err) {
                console.error('Fallback error:', err);
            }

            document.body.removeChild(textArea);
        }

        // Calculator 1 Logic
        let currentResult1 = '';

        function calculateResult1() {
            const input1 = parseFloat(document.getElementById('input1').value);
            const input1Error = document.getElementById('input1Error');

            // Validatie
            if (!input1 || input1 <= 0) {
                input1Error.classList.add('show');
                currentResult1 = 'Resultaat = -';
            } else {
                input1Error.classList.remove('show');

                // VERVANG DIT: Bereken hier je resultaat
                const result = input1 * 2; // Voorbeeld berekening
                currentResult1 = `Resultaat = ${result}`;
            }

            // Toon resultaten
            document.getElementById('result1').textContent = currentResult1;
            document.getElementById('results1').classList.add('show');
        }

        // Real-time berekening bij input wijziging
        document.getElementById('input1').addEventListener('input', calculateResult1);

        // Copy to clipboard functionaliteit voor Calculator 1
        document.getElementById('copyButton1').addEventListener('click', function () {
            const textToCopy = currentResult1;
            const btn = this;

            // Try modern clipboard API first
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(textToCopy).then(function () {
                    showCopyFeedback(btn);
                }).catch(function (err) {
                    console.error('Clipboard API mislukt, probeer fallback:', err);
                    fallbackCopyText(textToCopy, btn);
                });
            } else {
                // Fallback for older browsers or iframe restrictions
                fallbackCopyText(textToCopy, btn);
            }
        });

        // Reset functionality voor Calculator 1
        document.getElementById('resetButton1').addEventListener('click', function () {
            // VERVANG DIT: Reset logic afhankelijk van je input types
            // Voor number inputs:
            document.getElementById('input1').value = '';

            // Voor radio buttons gebruik:
            // document.querySelectorAll('input[name="optionname"]').forEach(radio => {
            //     if (radio.value === "0") {
            //         radio.checked = true;
            //     }
            // });

            // Voor dropdowns gebruik:
            // document.getElementById('selectId').selectedIndex = 0;

            calculateResult1();
        });

        // Initiële berekening
        calculateResult1();


        // Calculator 2 Logic (optioneel - verwijder indien niet nodig)
        let currentResult2 = '';

        function calculateResult2() {
            const input2 = parseFloat(document.getElementById('input2').value);
            const input2Error = document.getElementById('input2Error');

            // Validatie
            if (!input2 || input2 <= 0) {
                input2Error.classList.add('show');
                currentResult2 = 'Resultaat = -';
            } else {
                input2Error.classList.remove('show');

                // VERVANG DIT: Bereken hier je resultaat
                const result = input2 * 3; // Voorbeeld berekening
                currentResult2 = `Resultaat = ${result}`;
            }

            // Toon resultaten
            document.getElementById('result2').textContent = currentResult2;
            document.getElementById('results2').classList.add('show');
        }

        // Real-time berekening bij input wijziging
        document.getElementById('input2').addEventListener('input', calculateResult2);

        // Copy to clipboard functionaliteit voor Calculator 2
        document.getElementById('copyButton2').addEventListener('click', function () {
            const textToCopy = currentResult2;
            const btn = this;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(textToCopy).then(function () {
                    showCopyFeedback(btn);
                }).catch(function (err) {
                    console.error('Clipboard API mislukt, probeer fallback:', err);
                    fallbackCopyText(textToCopy, btn);
                });
            } else {
                fallbackCopyText(textToCopy, btn);
            }
        });

        // Reset functionality voor Calculator 2
        document.getElementById('resetButton2').addEventListener('click', function () {
            // VERVANG DIT: Reset logic afhankelijk van je input types
            document.getElementById('input2').value = '';
            calculateResult2();
        });

        // Initiële berekening
        calculateResult2();

        // Simpele iframe resizer: stuurt hoogte naar parent window
        function sendHeight() {
            var height = document.body.scrollHeight;
            window.parent.postMessage({ type: 'resize', height: height }, '*');
        }
        window.addEventListener('load', sendHeight);
        new MutationObserver(sendHeight).observe(document.body, {
            childList: true, subtree: true, attributes: true
        });
    </script>
</body>

</html>
