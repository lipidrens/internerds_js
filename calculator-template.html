<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Template</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="wrapper">
        <!-- Calculator 1 -->
        <div class="container">
            <h1>Calculator Titel</h1>
            <p class="subtitle">Beschrijving van de calculator</p>

            <form id="calculatorForm1">
                <div class="form-group">
                    <label for="input1">Input label</label>
                    <input type="number" id="input1" min="0" step="0.1" required placeholder="Bijv. 70">
                    <div class="error" id="input1Error">Voer een geldige waarde in</div>
                </div>

                <button type="submit">Bereken</button>
            </form>

            <div class="results" id="results1">
                <div class="result-item">
                    <div class="result-label">Resultaat</div>
                    <div class="result-value">
                        <span id="result1">-</span> <span class="unit">eenheid</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Calculator 2 (optioneel) -->
        <div class="container">
            <h1>Calculator Titel 2</h1>
            <p class="subtitle">Beschrijving van de calculator</p>

            <form id="calculatorForm2">
                <div class="form-group">
                    <label for="input2">Input label</label>
                    <input type="number" id="input2" min="0" step="0.1" required placeholder="Bijv. 70">
                    <div class="error" id="input2Error">Voer een geldige waarde in</div>
                </div>

                <button type="submit">Bereken</button>
            </form>

            <div class="results" id="results2">
                <div class="result-item">
                    <div class="result-label">Resultaat</div>
                    <div class="result-value">
                        <span id="result2">-</span> <span class="unit">eenheid</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Calculator 1 Logic
        document.getElementById('calculatorForm1').addEventListener('submit', function(e) {
            e.preventDefault();

            const input1 = parseFloat(document.getElementById('input1').value);
            const input1Error = document.getElementById('input1Error');

            // Validatie
            if (!input1 || input1 <= 0) {
                input1Error.classList.add('show');
                return;
            } else {
                input1Error.classList.remove('show');
            }

            // Bereken hier je resultaat
            const result = input1 * 2; // Voorbeeld berekening

            // Toon resultaten
            document.getElementById('result1').textContent = result;
            document.getElementById('results1').classList.add('show');
        });

        // Reset error bij input wijziging
        document.getElementById('input1').addEventListener('input', function() {
            document.getElementById('input1Error').classList.remove('show');
        });

        // Calculator 2 Logic
        document.getElementById('calculatorForm2').addEventListener('submit', function(e) {
            e.preventDefault();

            const input2 = parseFloat(document.getElementById('input2').value);
            const input2Error = document.getElementById('input2Error');

            // Validatie
            if (!input2 || input2 <= 0) {
                input2Error.classList.add('show');
                return;
            } else {
                input2Error.classList.remove('show');
            }

            // Bereken hier je resultaat
            const result = input2 * 3; // Voorbeeld berekening

            // Toon resultaten
            document.getElementById('result2').textContent = result;
            document.getElementById('results2').classList.add('show');
        });

        // Reset error bij input wijziging
        document.getElementById('input2').addEventListener('input', function() {
            document.getElementById('input2Error').classList.remove('show');
        });
    </script>
</body>
</html>
